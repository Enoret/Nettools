server {
    listen ${NETTOOLS_PORT};
    server_name _;

    # Frontend - static files
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Security headers (repeated in every location that uses add_header,
    # because nginx does not inherit add_header into such locations)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # App code (HTML/JS/CSS): always revalidate so updates show up right away.
    # index.html also references JS/CSS with ?v=<build> to bust old caches.
    location ~* \.(html|css|js)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Images / fonts: cache for a week
    location ~* \.(svg|png|jpg|jpeg|gif|ico|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # API proxy to backend
    location /api/ {
        proxy_pass http://127.0.0.1:${NETTOOLS_BACKEND_PORT};
        proxy_set_header Host $http_host;  # keeps the port (OIDC redirect URI)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeout for long-running operations (speed test, port scan)
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
    }

    # SPA fallback - serve index.html for all other routes
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
